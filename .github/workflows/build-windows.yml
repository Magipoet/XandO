name: Build Windows Executable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  FLUTTER_VERSION: '3.41.9'
  APP_NAME: 'tictactoe-game'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        channel: 'stable'
        cache: true
    
    - name: Install dependencies
      run: flutter pub get
      timeout-minutes: 10
    
    - name: Enable Windows desktop
      run: flutter config --enable-windows-desktop
    
    - name: Generate Windows platform files
      run: flutter create . --platforms windows
    
    - name: Build Windows executable
      run: flutter build windows --release
      timeout-minutes: 15
    
    - name: List build output
      run: |
        Get-ChildItem -Recurse build/windows/x64/runner/Release/
    
    - name: Create distribution package
      run: |
        $buildDir = "build/windows/x64/runner/Release"
        $distDir = "${{ env.APP_NAME }}-windows"
        
        New-Item -ItemType Directory -Path $distDir -Force
        Copy-Item -Path "$buildDir/*" -Destination $distDir -Recurse
        
        Compress-Archive -Path $distDir -DestinationPath "${{ env.APP_NAME }}-windows.zip"
    
    - name: Upload artifact (Directory)
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.APP_NAME }}-Windows-Directory
        path: ${{ env.APP_NAME }}-windows/
    
    - name: Upload artifact (ZIP)
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.APP_NAME }}-Windows-ZIP
        path: ${{ env.APP_NAME }}-windows.zip
    
    - name: Create Release (if tagged)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          ${{ env.APP_NAME }}-windows.zip
        generate_release_notes: true
        token: ${{ secrets.GITHUB_TOKEN }}
