name: Build Apple Platforms (macOS & iOS)

on:
  push:
    tags:
      - 'v*'
      - 'v*-apple'
  workflow_dispatch:
    inputs:
      build_macos:
        description: 'Build macOS app'
        required: true
        default: true
        type: boolean
      build_ios:
        description: 'Build iOS IPA'
        required: true
        default: true
        type: boolean

env:
  FLUTTER_VERSION: '3.41.9'
  APP_NAME: 'tictactoe-game'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-check:
    name: Pre-check Configuration
    runs-on: macos-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
      tag: ${{ steps.version.outputs.TAG }}
      build_macos: ${{ steps.build_flags.outputs.BUILD_MACOS }}
      build_ios: ${{ steps.build_flags.outputs.BUILD_IOS }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Validate version format
      id: version
      run: |
        if [[ "${{ github.ref }}" == refs/tags/* ]]; then
          TAG="${{ github.ref_name }}"
          if [[ "$TAG" == v* ]]; then
            VERSION="${TAG#v}"
            echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
            echo "TAG=$TAG" >> $GITHUB_OUTPUT
            echo "Valid tag format: $TAG -> Version: $VERSION"
          else
            echo "Invalid tag format. Tag should start with 'v', e.g., v1.1.1"
            exit 1
          fi
        else
          echo "Not a tag push, using default version"
          echo "VERSION=dev" >> $GITHUB_OUTPUT
          echo "TAG=dev" >> $GITHUB_OUTPUT
        fi

    - name: Check pubspec.yaml version
      run: |
        echo "Checking pubspec.yaml version..."
        if ! grep -q "version: " pubspec.yaml; then
          echo "❌ No version found in pubspec.yaml"
          exit 1
        fi
        VERSION_LINE=$(grep "version: " pubspec.yaml)
        echo "✅ pubspec.yaml version: $VERSION_LINE"

    - name: Determine build flags
      id: build_flags
      run: |
        if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
          BUILD_MACOS="${{ inputs.build_macos }}"
          BUILD_IOS="${{ inputs.build_ios }}"
        else
          BUILD_MACOS="true"
          BUILD_IOS="true"
        fi
        echo "BUILD_MACOS=$BUILD_MACOS" >> $GITHUB_OUTPUT
        echo "BUILD_IOS=$BUILD_IOS" >> $GITHUB_OUTPUT
        echo "Build flags determined:"
        echo "  - macOS: $BUILD_MACOS"
        echo "  - iOS: $BUILD_IOS"

    - name: Check iOS signing secrets (for tagged builds)
      if: startsWith(github.ref, 'refs/tags/')
      env:
        IOS_CERT: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
        IOS_CERT_PWD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        IOS_PROFILE: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        IOS_KEYCHAIN_PWD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
      run: |
        echo "Checking iOS signing configuration..."
        ERROR=0
        
        if [ -z "$IOS_CERT" ]; then
          echo "⚠️ IOS_CERTIFICATE_BASE64 is not configured (optional for non-signed builds)"
        else
          echo "✅ IOS_CERTIFICATE_BASE64 is configured"
        fi
        
        if [ -z "$IOS_KEYCHAIN_PWD" ]; then
          echo "⚠️ IOS_KEYCHAIN_PASSWORD is not configured (optional)"
        else
          echo "✅ IOS_KEYCHAIN_PASSWORD is configured"
        fi
        
        echo "Note: iOS builds can be created without signing (for development only)"

  build-macos:
    name: Build macOS Desktop App
    needs: pre-check
    if: needs.pre-check.outputs.build_macos == 'true'
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        channel: 'stable'
        cache: true

    - name: Enable macOS desktop
      run: flutter config --enable-macos-desktop

    - name: Install dependencies
      run: flutter pub get
      timeout-minutes: 10

    - name: Generate macOS platform files
      run: flutter create . --platforms macos
      timeout-minutes: 5

    - name: List generated macOS files
      run: |
        echo "Generated macOS files:"
        ls -la macos/
        ls -la macos/Runner/

    - name: Build macOS release
      run: flutter build macos --release
      timeout-minutes: 20

    - name: List build output
      run: |
        echo "Build output directory:"
        ls -la build/macos/Build/Products/Release/

    - name: Verify app bundle exists
      run: |
        APP_PATH="build/macos/Build/Products/Release/tictactoe_game.app"
        if [ -d "$APP_PATH" ]; then
          echo "✅ macOS app bundle found at: $APP_PATH"
          ls -la "$APP_PATH"
        else
          echo "❌ macOS app bundle not found"
          find build/macos -name "*.app" -type d
          exit 1
        fi

    - name: Create ZIP distribution
      env:
        VERSION: ${{ needs.pre-check.outputs.tag }}
      run: |
        APP_VERSION=${VERSION:-dev}
        APP_PATH="build/macos/Build/Products/Release/tictactoe_game.app"
        DIST_DIR="${{ env.APP_NAME }}-macos-$APP_VERSION"
        
        mkdir -p "$DIST_DIR"
        cp -R "$APP_PATH" "$DIST_DIR/"
        
        echo "📦 Creating ZIP archive..."
        zip -r "${{ env.APP_NAME }}-macos-$APP_VERSION.zip" "$DIST_DIR"
        
        echo "✅ ZIP created:"
        ls -la *.zip

    - name: Create DMG disk image (optional)
      env:
        VERSION: ${{ needs.pre-check.outputs.tag }}
      run: |
        APP_VERSION=${VERSION:-dev}
        APP_PATH="build/macos/Build/Products/Release/tictactoe_game.app"
        DMG_NAME="${{ env.APP_NAME }}-macos-$APP_VERSION.dmg"
        
        echo "📦 Creating DMG disk image..."
        
        TEMP_DIR=$(mktemp -d)
        mkdir -p "$TEMP_DIR/dmg"
        cp -R "$APP_PATH" "$TEMP_DIR/dmg/"
        ln -s /Applications "$TEMP_DIR/dmg/Applications"
        
        hdiutil create -volname "TicTacToe Game $APP_VERSION" \
          -srcfolder "$TEMP_DIR/dmg" \
          -ov -format UDZO \
          "$DMG_NAME"
        
        rm -rf "$TEMP_DIR"
        
        echo "✅ DMG created:"
        ls -la *.dmg

    - name: Upload macOS ZIP as Artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.APP_NAME }}-macOS-ZIP
        path: ${{ env.APP_NAME }}-macos-*.zip
        retention-days: 90

    - name: Upload macOS DMG as Artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.APP_NAME }}-macOS-DMG
        path: ${{ env.APP_NAME }}-macos-*.dmg
        retention-days: 90

  build-ios:
    name: Build iOS App (IPA)
    needs: pre-check
    if: needs.pre-check.outputs.build_ios == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        channel: 'stable'
        cache: true

    - name: Install dependencies
      run: flutter pub get
      timeout-minutes: 10

    - name: Generate iOS platform files
      run: flutter create . --platforms ios
      timeout-minutes: 5

    - name: List generated iOS files
      run: |
        echo "Generated iOS files:"
        ls -la ios/
        ls -la ios/Runner/

    - name: Setup iOS code signing (if secrets configured)
      env:
        IOS_CERT_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
        IOS_CERT_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        IOS_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
      if: ${{ env.IOS_CERT_BASE64 != '' }}
      run: |
        echo "🔐 Setting up iOS code signing..."
        
        KEYCHAIN_NAME="ios-build.keychain"
        KEYCHAIN_PASSWORD="${{ secrets.IOS_KEYCHAIN_PASSWORD }}"
        
        if [ -z "$KEYCHAIN_PASSWORD" ]; then
          KEYCHAIN_PASSWORD="temp-password-123"
        fi
        
        security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"
        security set-keychain-settings -lut 21600 "$KEYCHAIN_NAME"
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"
        
        echo "$IOS_CERT_BASE64" | base64 -d > certificate.p12
        security import certificate.p12 -k "$KEYCHAIN_NAME" -P "$IOS_CERT_PASSWORD" -T /usr/bin/codesign
        
        security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"
        
        mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
        echo "$IOS_PROFILE_BASE64" | base64 -d > profile.mobileprovision
        
        UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' /dev/stdin <<< $(security cms -D -i profile.mobileprovision))
        cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision
        
        security default-keychain -s "$KEYCHAIN_NAME"
        
        echo "✅ iOS code signing configured"
        echo "Provisioning Profile UUID: $UUID"

    - name: Build iOS (no codesign for development)
      env:
        IOS_CERT_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
      run: |
        if [ -z "$IOS_CERT_BASE64" ]; then
          echo "🔨 Building iOS without code signing (development build)..."
          flutter build ios --release --no-codesign
        else
          echo "🔨 Building iOS with code signing..."
          flutter build ios --release
        fi
      timeout-minutes: 30

    - name: List iOS build output
      run: |
        echo "iOS build output:"
        find build/ios -name "*.app" -o -name "*.ipa" 2>/dev/null || true
        ls -la build/ios/iphoneos/ 2>/dev/null || true
        ls -la build/ios/Release-iphoneos/ 2>/dev/null || true

    - name: Create IPA (for development builds)
      env:
        VERSION: ${{ needs.pre-check.outputs.tag }}
        IOS_CERT_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
      run: |
        APP_VERSION=${VERSION:-dev}
        
        APP_DIR=""
        if [ -d "build/ios/iphoneos/Runner.app" ]; then
          APP_DIR="build/ios/iphoneos/Runner.app"
        elif [ -d "build/ios/Release-iphoneos/Runner.app" ]; then
          APP_DIR="build/ios/Release-iphoneos/Runner.app"
        fi
        
        if [ -z "$APP_DIR" ] || [ ! -d "$APP_DIR" ]; then
          echo "❌ Runner.app not found"
          exit 1
        fi
        
        echo "✅ Found app at: $APP_DIR"
        
        PAYLOAD_DIR="Payload"
        mkdir -p "$PAYLOAD_DIR"
        cp -R "$APP_DIR" "$PAYLOAD_DIR/"
        
        IPA_NAME="${{ env.APP_NAME }}-ios-$APP_VERSION.ipa"
        
        zip -r "$IPA_NAME" "$PAYLOAD_DIR"
        
        rm -rf "$PAYLOAD_DIR"
        
        echo "✅ IPA created: $IPA_NAME"
        ls -la *.ipa

    - name: Upload iOS IPA as Artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.APP_NAME }}-iOS-IPA
        path: ${{ env.APP_NAME }}-ios-*.ipa
        retention-days: 90

  create-release:
    name: Create Apple Platforms Release
    needs: [pre-check, build-macos, build-ios]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: startsWith(github.ref, 'refs/tags/')
    steps:
    - name: Download macOS ZIP Artifact
      if: needs.pre-check.outputs.build_macos == 'true'
      uses: actions/download-artifact@v7
      with:
        name: ${{ env.APP_NAME }}-macOS-ZIP
        path: ./release-apple

    - name: Download macOS DMG Artifact
      if: needs.pre-check.outputs.build_macos == 'true'
      uses: actions/download-artifact@v7
      with:
        name: ${{ env.APP_NAME }}-macOS-DMG
        path: ./release-apple

    - name: Download iOS IPA Artifact
      if: needs.pre-check.outputs.build_ios == 'true'
      uses: actions/download-artifact@v7
      with:
        name: ${{ env.APP_NAME }}-iOS-IPA
        path: ./release-apple

    - name: List release assets
      run: |
        echo "📦 Apple Platforms Release assets:"
        if [ -d "./release-apple" ]; then
          ls -la ./release-apple/
          echo ""
          echo "Files to be uploaded:"
          find ./release-apple -type f
        else
          echo "No release assets found"
        fi

    - name: Create GitHub Release (Apple Platforms)
      if: ${{ hashFiles('./release-apple/*') != '' }}
      uses: softprops/action-gh-release@v2
      with:
        files: |
          ./release-apple/*
        tag_name: ${{ github.ref_name }}
        append_body: true
        body: |
          ## Apple 平台构建产物

          ### macOS
          - `*.zip` - macOS 应用压缩包
          - `*.dmg` - macOS 磁盘镜像（推荐）

          ### iOS
          - `*.ipa` - iOS 安装包
            > ⚠️ 注意：此 IPA 可能需要签名才能在真机安装。如果使用了开发证书，请确保设备已注册到开发者账号。

          安装说明：
          - **macOS**: 打开 DMG，将应用拖入 Applications 文件夹
          - **iOS**: 使用 iTunes 或 Xcode 安装 IPA
        token: ${{ secrets.GITHUB_TOKEN }}
